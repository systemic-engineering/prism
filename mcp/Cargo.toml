[package]
name = "prism-mcp"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "prism's floor as a read-only MCP server over stdio (prism-025 §2): echo and chorus as tools, over a hand-written JSON wire (RFC 8259 + I-JSON, exact numbers or refused). No serde, no JSON crate, no mirror crate, no keys."
repository = "https://github.com/systemic-engineering/prism"
publish = false

# One integration-test binary (tests/main.rs), as echo and chorus do.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

# The server: stdin in, stdout out, nothing else (docs/spec/mcp.md §1).
[[bin]]
name = "prism-mcp"
path = "src/bin/prism-mcp.rs"

# echo and chorus only (docs/spec/mcp.md §6). checks.prism-mcp-independent
# holds the rest of the graph: no serde, no JSON crate, no mirror crate, no
# prismqueer, nothing LAPACK, BLAS or Fortran. No dev-dependencies either:
# the root's dev edges count.
[dependencies]
echo = { path = "../echo" }
chorus = { path = "../chorus" }
