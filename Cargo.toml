[workspace]
members = ["imperfect", "ledger-verify", "listen", "prismqueer", "projections"]
resolver = "2"

# Per Taut's profiling survey (mirror #286 Win 1, mirrored here on
# 2026-06-09): the default dev / test profiles inherit small
# codegen-units counts which serialise the per-test-binary codegen
# and dominate incremental rebuild wall-time. Bumping to 256 splits
# the codegen across cores. No behavioural impact (dev / test are
# not the artefacts we ship); strictly a tooling tick.
[profile.dev]
codegen-units = 256

[profile.test]
codegen-units = 256

# ledger-verify's tests sign SLH-DSA-SHA2-128s once per run (the anchor):
# a few million SHA-256 compressions, ~40s unoptimised. Optimising the two
# crates that do that hashing makes it about a second. Dependencies only; the
# workspace crates keep the dev profile's checks.
[profile.dev.package.slh-dsa]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
