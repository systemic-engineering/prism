[package]
name = "echo"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "prism's second reader of mirror's reflections (prism-022): it never authors, it gives the engine's record back. The cut at `---` and the typed facts reader, from mirror's spec text. no_std, no mirror crate, no LAPACK."
repository = "https://github.com/systemic-engineering/prism"
publish = false

# One integration-test binary (tests/main.rs), as chorus does.
autotests = false

[[test]]
name = "main"
path = "tests/main.rs"

# The entry `prism echo <source> <certificate> <record> [<score>]`
# (docs/spec/echo.md §10.1): a std binary over the no_std library. It
# reads its arguments and nothing else. checks.echo-portable builds the
# library only (`--lib`).
[[bin]]
name = "prism"
path = "src/bin/prism.rs"

# One dependency: blake3, for the address law H (fixpoint §5.0: "BLAKE3,
# default (unkeyed) mode, 32-byte output"). Pinned exactly, at the version
# prism's lockfile already holds (prismqueer's `=1.8.7`) and the b3sum that
# checked mirror's vectors (1.8.7). no_std (no `std` feature) and `pure`:
# the portable Rust implementation only, no C or assembly from build.rs.
# checks.echo-independent holds the rest of the graph: no prismqueer, no
# mirror crate, nothing LAPACK, BLAS or Fortran, at any depth and of any
# kind (docs/spec/echo.md §2).
[dependencies]
blake3 = { version = "=1.8.7", default-features = false, features = ["pure"] }
